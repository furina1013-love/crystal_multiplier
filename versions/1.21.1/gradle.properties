# 构建加速：常驻 daemon + 并行 + 构建缓存 + 配置缓存
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.vfs.watch=true

# Minecraft / NeoForge（两值必须对应同一 MC 版本）
minecraft_version=1.21.1
neo_version=21.1.249

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.1]
neo_version_range=[21.1.248,)

# Mod metadata（mod_id 与 @Mod 注解必须一致）
mod_id=crystal_multiplier
mod_name=Crystal Multiplier
mod_version=1.8.2
mod_group_id=cn.furina.crystalmultiplier
mod_authors=芙宁娜重度依赖, b站：furina重度依赖-1013
mod_license=MIT
mod_description=Mekanism styled crystal multiplier for AE2 crystals
