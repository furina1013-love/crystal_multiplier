plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.7.0'
group = 'cn.woxin.crystalmultiplier'
base { archivesName = 'crystal_multiplier' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { crystal_multiplier { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { crystal_multiplier { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://maven.blamejared.com' }
    // Mekanism itself, so the upgrade cards can go through Mekanism own IUpgradeItem interface.
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    // JEI is optional: only the compat classes touch it, and they are discovered by JEI itself.
    compileOnly "mezz.jei:jei-1.20.1-forge:15.20.0.134"
    // Mekanism is a hard dependency of this mod (see mods.toml), so it is fine to compile against it:
    // mekanism.api.Upgrade and mekanism.common.item.interfaces.IUpgradeItem are what upgrade cards use.
    compileOnly("maven.modrinth:mekanism:uxe1WQp4") { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    var replaceProperties = [mod_version: project.version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) { expand replaceProperties }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'crystal_multiplier',
            'Specification-Vendor'    : 'woxin',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'woxin',
            'MixinConfigs'            : 'crystal_multiplier.mixins.json'
        ])
    }
}
